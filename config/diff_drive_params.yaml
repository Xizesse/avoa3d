avoa3dnode:
  ros__parameters:
    # Kinematic mode
    kinematic_mode: "diff_drive"

    heading_weight: 0.5
    abs_weight: 0.5
    danger_weight: 0.5
    
    # Vehicle parameters
    vehicle_radius: 0.5

    # Time step
    delta_t: 1.0
    
    # Sampling parameters
    num_samples: 10000
    
    # 6DOF parameters
    # Maximum accelerations
    a_x_max: 3.0
    a_y_max: 0.0
    a_z_max: 0.0

    # Maximum angular accelerations
    a_roll_max: 0.0
    a_pitch_max: 0.0
    a_yaw_max: 0.0

    # Maximum linear velocities
    v_x_max: 1.2
    v_y_max: 0.0
    v_z_max: 0.0

    # Maximum angular velocities
    w_roll_max: 0.0
    w_pitch_max: 0.0
    w_yaw_max: 1.2


