avoa3dnode:
  ros__parameters:
    # AVOA PARAMS
    kinematic_mode : "holonomic"

    heading_weight: 0.5
    abs_weight: 0.5
    danger_weight: 0.5

  
    
    # Vehicle parameters
    vehicle_radius: 0.5
    
    # Holonomic parameters
    # Maximum accelerations
    a_x_max: 3.0
    a_y_max: 3.0
    a_z_max: 3.0
    
    # Maximum velocities
    v_x_max: 1.0
    v_y_max: 1.0
    v_z_max: 1.0

    # Time step
    delta_t: 1.0
    
    # Sampling parameters
    num_samples: 420